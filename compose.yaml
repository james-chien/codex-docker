services:
  codex:
    build:
      context: .
      dockerfile: Dockerfile
    image: codex-docker
    container_name: codex
    working_dir: /workspace
    stdin_open: true
    tty: true
    init: true

    ports:
      # Expose port 8000 to access apps in the container via browser
      - "8000:8000"

    volumes:
      - ./workspace:/workspace
      - ./codex:/root/.codex

    stop_signal: SIGINT

    security_opt:
      - no-new-privileges:true

    restart: "no"
